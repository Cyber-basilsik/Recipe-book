<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft — contents, panels</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet" />
    <!-- Same markup as src/pages/ContentsPage.tsx, against the app's real stylesheet. -->
    <link rel="stylesheet" href="../../recipe-book/src/styles/theme.css" />
    <!-- ?theme=<id> layers one of the drafts in themes/ over the stylesheet. -->
    <script src="themes/themes.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner container">
        <a href="#" class="toolbar-pill">
          <svg class="toolbar-pill__icon" viewBox="0 0 20 10" fill="none" aria-hidden="true">
            <path d="M1 3c3-2.5 5 2.5 9 0s6-2.5 9 0" />
            <path d="M1 8c3-2.5 5 2.5 9 0s6-2.5 9 0" />
          </svg>
          Menu
        </a>
        <a href="welcome.html" class="logo">
          <span class="logo__mark" aria-hidden="true"></span>
          <span class="logo__text">Recipe<span>Book</span></span>
        </a>
        <div class="user-menu">
          <button type="button" class="toolbar-pill user-menu__toggle" aria-expanded="false">
            <span class="avatar avatar--sm" aria-hidden="true">C</span>
            <span class="site-nav__name">cook</span>
            <span class="user-menu__caret" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="toc container">
        <div class="toc__head">
          <h1 class="toc__title">Table of<br />contents</h1>
          <a href="#" class="btn btn--primary">New recipe</a>
        </div>

        <div class="toc__viewport">
          <button type="button" class="toc__arrow toc__arrow--prev" aria-label="Previous chapters">‹</button>
          <ol class="toc__track">
            <li class="panel-card">
              <a href="#">
                <span class="panel-card__collage">
                  <img src="../../recipe-book/src/assets/breakfast.jpg" alt="" />
                  <img src="../../recipe-book/src/assets/lunch.jpg" alt="" />
                  <img src="../../recipe-book/src/assets/dinner.jpg" alt="" />
                  <img src="../../recipe-book/src/assets/drink.jpg" alt="" />
                </span>
                <span class="panel-card__num">01</span>
                <span class="panel-card__name">All</span>
              </a>
            </li>
            <li class="panel-card">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/breakfast.jpg" alt="" />
                <span class="panel-card__num">02</span>
                <span class="panel-card__name">Breakfast</span>
              </a>
            </li>
            <li class="panel-card">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/lunch.jpg" alt="" />
                <span class="panel-card__num">03</span>
                <span class="panel-card__name">Lunch</span>
              </a>
            </li>
            <li class="panel-card">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/dinner.jpg" alt="" />
                <span class="panel-card__num">04</span>
                <span class="panel-card__name">Dinner</span>
              </a>
            </li>
            <li class="panel-card">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/snacks.jpg" alt="" />
                <span class="panel-card__num">05</span>
                <span class="panel-card__name">Snacks</span>
              </a>
            </li>
            <li class="panel-card">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/drink.jpg" alt="" />
                <span class="panel-card__num">06</span>
                <span class="panel-card__name">Drinks</span>
              </a>
            </li>
            <li class="panel-card panel-card--zoom">
              <a href="#">
                <img class="panel-card__img" src="../../recipe-book/src/assets/snacks.jpg" alt="" />
                <span class="panel-card__num">07</span>
                <span class="panel-card__name">Dessert</span>
              </a>
            </li>
          </ol>
          <button type="button" class="toc__arrow toc__arrow--next" aria-label="More chapters">›</button>
        </div>
      </section>
    </main>

    <script>
      const track = document.querySelector('.toc__track');
      const step = (dir) => {
        const card = track.querySelector('.panel-card');
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
        track.scrollBy({ left: dir * (card.offsetWidth + gap), behavior: 'smooth' });
      };
      document.querySelector('.toc__arrow--prev').addEventListener('click', () => step(-1));
      document.querySelector('.toc__arrow--next').addEventListener('click', () => step(1));
      // #end opens on the last chapters (used for a screenshot).
      if (location.hash === '#end') track.scrollLeft = track.scrollWidth;
    </script>
  </body>
</html>
